name: Centrica
kind: company
description: >-
  Centrica plc is the FTSE-listed British energy and services group behind British Gas,
  the United Kingdom's largest household energy supplier, along with Bord Gais Energy in
  Ireland, Centrica Business Solutions, Centrica Energy (its wholesale power, gas and LNG
  trading arm) and the Hive connected-home brand. It sits across the whole value chain —
  upstream gas and storage at Rough, generation and battery flexibility, wholesale trading
  and route-to-market, retail supply to roughly ten million UK homes, and a field-service
  engineering business — after exiting North America with the sale of Direct Energy to NRG
  in January 2021 to refocus on the UK and Ireland. Its API posture is honestly closed:
  Britain mandated the smart-metering INFRASTRUCTURE (the licensed Smart DCC monopoly and
  the SMETS2 rollout) rather than a consumer data right, so Centrica has no Consumer Data
  Right, no Green Button and no standards-conformant consumer usage endpoint. The DESNZ
  non-domestic smart meter data access requirement that does bind it is discharged by a
  written request answered within ten working days, not by an API. Household consumers reach
  their own data only through the British Gas app and account login; business customers
  through the Energy360 DataView portal. The single publicly reachable developer surface found
  is the Centrica FieldOps Azure API Management developer portal — a partner field-operations
  platform in its development environment — and Centrica publishes no open grid or market data
  of its own, leaving that to NESO, Elexon and the DNOs.
