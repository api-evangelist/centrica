apis:
- aid: centrica:centrica-fieldops-identity-api
  name: Centrica FieldOps Identity API
  description: >-
    Token-issuing API on the Centrica FieldOps API Management platform, published on
    Centrica's Azure API Management developer portal. A single POST /oauth2/token
    operation exchanges an OAuth2 client_credentials grant (client_id + client_secret,
    form-encoded) for a bearer access token used against the FieldOps WorkOrder,
    Opportunity and Appointment Slots APIs. Harvested verbatim from the portal's
    development environment on 2026-07-27; the production hosts api.fieldops.centrica.com
    and api-developer.fieldops.centrica.com both answer 403 anonymously. Calls also carry
    an Azure APIM subscription key (Ocp-Apim-Subscription-Key header or subscription-key
    query parameter).
  humanURL: https://api-developer.dev.fieldops.centrica.com/api-details#api=identity-api
  baseURL: https://api.dev.fieldops.centrica.com/api/v1/identity
