description: >-
  Centrica publishes no API lifecycle governance. There is no versioning policy page, no
  deprecation policy, no Sunset/Deprecation header commitment, no changelog and no status
  page on any Centrica, British Gas, Bord Gais Energy or Hive host. What can be recorded is
  entirely structural: the FieldOps Identity API is versioned in the URI path (api/v1/identity),
  sits at Azure APIM apiRevision 1 with isCurrent true, declares OpenAPI info.version "1.0",
  and the FieldOps developer portal home page advertises a single availability figure —
  "99.95% availability. Our APIs can be used for mission-critical systems." That claim is a
  marketing statement on the DEVELOPMENT portal, not a contracted SLA document; no SLA terms,
  credits regime or measurement window is published.
