description: >-
  Centrica publishes no commercial API pricing. The only access tiers that exist anywhere on
  a Centrica developer surface are the two default Azure API Management products on the
  Centrica FieldOps developer portal (DEVELOPMENT environment), read verbatim from that
  portal's own management API. Both are subscription-gated and neither carries a price —
  they are access tiers, not paid plans. Real FieldOps access is a commercial partner
  arrangement with Centrica's field-service business; the production portal and gateway
  (api-developer.fieldops.centrica.com, api.fieldops.centrica.com) both answer 403
  anonymously. No consumer or business energy-data API is sold at any price.
sources:
- https://api-developer.dev.fieldops.centrica.com/products
- https://api-management.dev.fieldops.centrica.com/subscriptions/000/resourceGroups/000/providers/Microsoft.ApiManagement/service/fieldopsdev001/products?api-version=2022-04-01-preview
