notes: >-
  These are the stock Azure API Management "Starter" and "Unlimited" product templates,
  left at their default descriptions. That is itself the finding: Centrica has not curated
  a commercial API packaging layer. Recorded verbatim rather than interpreted — the
  5 calls/minute and 100 calls/week figures are Centrica's own published text, not an
  inference.
