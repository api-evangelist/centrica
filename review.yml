notes: >-
  Centrica is the control case for the sector question. Australia extended a statutory
  consumer data right to energy and got identical, register-listed, standards-conformant
  APIs out of its retailers. Ontario regulated Green Button and got Download My Data and
  Connect My Data. Britain regulated the pipes instead — a licensed DCC monopoly moving
  SMETS2 traffic, Elexon settling the balancing market, NESO running the system and
  publishing a genuinely open Carbon Intensity API — and left the consumer data right
  unwritten. The result at the largest UK supplier is exactly what that predicts: an
  in-force DESNZ data-access obligation satisfied by a ten-working-day email, a
  login-only customer experience, no published standard, no open market data of its own,
  and the only reachable developer portal belonging to the field-service partner platform
  in its development environment. The UK's API-native energy supplier is Octopus, not
  Centrica, and Octopus built that voluntarily — which is the point.
