aid: centrica
name: Centrica
review:
  question: >-
    Does Centrica (British Gas) publish a public developer API, and does any energy
    consumer-data mandate actually bind and get implemented by it?
  answer: partial
  date: '2026-07-27'
  reviewer: API Evangelist
  summary: >-
    One publicly reachable developer surface exists — the Centrica FieldOps Azure API
    Management developer portal, in its DEVELOPMENT environment — from which one real
    OpenAPI 3.0.1 document was harvested. There is no consumer energy data API, no
    Green Button, no Consumer Data Right, and no open market data published by Centrica
    itself. The UK obligation that does bind British Gas is discharged by manual request,
    not by an API.

mandate:
  homeMarket: United Kingdom (plus Republic of Ireland via Bord Gais Energy)
  regime: smart-meter-infrastructure
  status: designated-not-live
  regimeVerbatim: >-
    Britain mandated the INFRASTRUCTURE, not the data right. The Smart Data Communications
    Company (Smart DCC) is a licensed monopoly carrying SMETS2 smart-meter traffic, and
    British Gas is a DCC user as a licensed supplier — but the DCC is a regulated
    industry network, not a public API, and Centrica publishes no consumer-facing endpoint
    on top of it. There is NO United Kingdom equivalent of the Australian Consumer Data
    Right for energy: no accredited-recipient regime, no designated data holders, no
    standards-conformant consumer base URI. The one consumer-adjacent obligation found is
    the DESNZ (Department for Energy Security and Net Zero) non-domestic smart meter data
    access requirement, cited by British Gas Business itself on
    https://www.britishgas.co.uk/business/blog/the-way-businesses-can-request-smart-meter-data-is-changing
    (HTTP 200, fetched 2026-07-27): part one in force 1 December 2022 (data on request),
    part two in force 1 October 2024 (default offer of data). Business customers, or a
    third party they nominate, get up to twelve months of historic smart meter usage data
    free of charge and the supplier must respond within ten working days.
  implementationVerdict: >-
    MANDATE IS NOT AN IMPLEMENTATION. The DESNZ obligation is genuinely in force and
    British Gas states it complies — but the compliance mechanism is a written request
    answered by a human within ten working days. No endpoint, no register entry, no
    schema, no standard. The British Gas page carries no API reference of any kind. That
    is the finding: an in-force UK data-access obligation discharged entirely through
    non-API channels.
  cdrEnergy: not-applicable — Centrica has no Australian operations; no CDR register entry sought or found.
  greenButton: >-
    not-applicable — Centrica exited North America when it sold Direct Energy to NRG Energy
    on 5 January 2021, so the Ontario Green Button regulation and the US voluntary
    Green Button / ESPI ecosystem no longer touch any Centrica entity. No Green Button
    Alliance certification, Download My Data, or Connect My Data surface exists.

dataStandard:
  implemented: no standard reference found
  detail: >-
    No Green Button / ESPI, no CDR Consumer Data Standards (energy), no IEEE 2030.5,
    no OpenADR, no OCPP or OCPI, no IEC CIM 61968/61970 reference was found on any
    Centrica or British Gas property. The only standards in play are UK SMETS2 / Smart DCC
    on the metering infrastructure side, which is a regulated industry network rather
    than a published API, and generic OpenAPI 3.0.1 + OAuth2 client_credentials on the
    FieldOps partner platform.

dataSplit:
  consumerDataApi: false
  consumerDataDetail: >-
    No third party can obtain an individual customer's usage or billing data from Centrica
    through a documented API. Household customers see their own consumption only inside
    the British Gas app and web account. Business customers use the Energy360 DataView
    portal (https://www.britishgas.co.uk/business/gas-and-electricity/energy360, HTTP 200)
    which is a login-gated web tool, not an API. The DESNZ non-domestic entitlement is
    fulfilled by email/telephone request. Hive, Centrica's connected-home brand, has never
    published an official public API; community Home Assistant integrations reverse-engineer
    the undocumented Hive backends (beekeeper.hivehome.com answered 403, sso.hivehome.com
    answered 200 HTML but /.well-known/openid-configuration answered 403).
  marketDataOpen: false
  marketDataDetail: >-
    Centrica publishes no open grid, system or market data of its own. Centrica Energy
    (centricaenergy.com, HTTP 200) is a trading business — power, gas and LNG, PPAs,
    biomethane, certificates, battery and flexibility optimisation — and its site names no
    data platform, API or open data offering. Its internal analytics platform (APE) is not
    public. Centrica's REMIT Article 4(1) inside-information / urgent market messages site
    www.centricaremit.com is indexed by search engines but TIMED OUT on every probe
    (HTTP 000, connection timeout after 20s, on /, /index.asp?pageid=1202 and /robots.txt),
    so no live REMIT disclosure feed could be confirmed. The genuinely open UK energy data
    — NESO Carbon Intensity, Elexon BMRS/Insights, the DNO open-data portals — is published
    by those bodies, not by Centrica. Centrica is a consumer of that open data, not a
    publisher of it. THE SPLIT IS THE FINDING: closed on consumer data, and absent from
    open market data as well.

access:
  gate: partner-only
  gated: true
  whatADeveloperMustDo: >-
    There is no public Centrica developer programme to join. The only live portal is
    Centrica FieldOps API Management (https://api-developer.dev.fieldops.centrica.com/,
    HTTP 200), which is a partner field-operations platform in its DEVELOPMENT environment;
    it offers an open Sign up form and two default Azure APIM products — "Starter"
    (5 calls/minute, 100 calls/week, subscription required, approval NOT required) and
    "Unlimited" (subscription required, administrator approval required). The portal home
    page advertises three business APIs — WorkOrder (annual service visits, intermediate
    breakdowns), Opportunity (electric vehicle sales opportunities) and Appointment Slots
    (get and reserve appointments for work orders) — but NONE of them are visible
    anonymously; the anonymous API list returns only the Identity API. The production hosts
    api-developer.fieldops.centrica.com and api.fieldops.centrica.com both answer 403, so
    real access is a commercial partner arrangement with Centrica's field-service business.
    A consumer or fintech developer wanting energy usage data has no route at all beyond
    asking the customer to request it in writing.
  authModel: >-
    OAuth2 client_credentials grant — POST /oauth2/token with grant_type, client_id and
    client_secret as application/x-www-form-urlencoded, returning a Bearer token
    (token_type, access_token, expires_in, expires_on, not_before, resource) — layered
    under Azure API Management subscription keys sent as the Ocp-Apim-Subscription-Key
    header or the subscription-key query parameter. No anonymous OpenID Connect discovery
    document is served: /.well-known/openid-configuration returned 404 on
    www.britishgas.co.uk and auth.britishgas.co.uk, 403 on sso.hivehome.com and
    beekeeper.hivehome.com, 502 on api.britishgas.co.uk, and 400 on the FieldOps APIM host.

