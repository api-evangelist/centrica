description: >-
  Index of the /.well-known/ discovery surface across every Centrica-controlled host.
  Two documents answer 200 and were saved verbatim: an RFC 9116 security.txt on
  www.britishgas.co.uk pointing at the British Gas responsible-disclosure policy, and a
  full OpenID Connect discovery document on www.centrica.com. The latter is NOT a Centrica
  developer API — it is the Umbraco CMS member-authentication surface of the corporate
  website (issuer https://www.centrica.com/, endpoints under /umbraco/delivery/api/v1/security/member/).
  It is recorded because it is a real, anonymous, machine-readable OAuth2/OIDC contract
  published on a Centrica host. The Umbraco Delivery API endpoints themselves
  (/umbraco/delivery/api/v2/content, /umbraco/swagger/delivery/swagger.json) are blocked by
  the corporate WAF and return 403, so no OpenAPI could be harvested from that host.
  The FieldOps partner platform hosts serve no /.well-known/ documents at all.
